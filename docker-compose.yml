services:
  postgres:
    image: postgres:16-alpine
    container_name: chatto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatto_phase2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Private database password required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatto_phase2"]
      interval: 3s
      timeout: 3s
      retries: 20

  db-init:
    profiles: ["maintenance"]
    image: chatto-api:local
    build:
      context: .
      target: api
    restart: "no"
    environment:
      DATABASE_URL: ${ADMIN_DATABASE_URL:?Admin database URL required}
      CHECKPOINT_DISABLE: "1"
    command: ["pnpm", "--filter", "@chatto/api", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    image: chatto-ai-service:local
    build:
      context: .
      target: ai-service
    container_name: chatto-ai-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      AI_SERVICE_PORT: 5000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Private AI service token required}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Private internal service token required}
      INTERNAL_API_BASE_URL: http://api:4000
      AI_LLM_PROVIDER: ${AI_LLM_PROVIDER:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      GEMINI_API_BASE_URL: ${GEMINI_API_BASE_URL:-https://generativelanguage.googleapis.com/v1/interactions}
      GEMINI_TIMEOUT_MS: ${GEMINI_TIMEOUT_MS:-10000}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
      GEMINI_EMBEDDING_DIMENSIONS: ${GEMINI_EMBEDDING_DIMENSIONS:-768}
      GEMINI_EMBEDDING_TIMEOUT_MS: ${GEMINI_EMBEDDING_TIMEOUT_MS:-10000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  api:
    image: chatto-api:local
    build:
      context: .
      target: api
    container_name: chatto-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 4000
      AI_SERVICE_BASE_URL: http://ai-service:5000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Private AI service token required}
      AI_SERVICE_TIMEOUT_MS: ${AI_SERVICE_TIMEOUT_MS:-20000}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Private internal service token required}
      DATABASE_URL: ${API_DATABASE_URL:?Restricted API database URL required}
      JWT_SECRET: ${JWT_SECRET:-}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      LINE_LOGIN_CHANNEL_ID: ${LINE_LOGIN_CHANNEL_ID:-}
      LINE_LOGIN_CHANNEL_SECRET: ${LINE_LOGIN_CHANNEL_SECRET:-}
      LINE_LOGIN_REDIRECT_URI: ${LINE_LOGIN_REDIRECT_URI:-}
      LINE_REPLY_TIMEOUT_MS: ${LINE_REPLY_TIMEOUT_MS:-5000}
      LINE_CREDENTIAL_KEYRING: ${LINE_CREDENTIAL_KEYRING:-}
      LINE_CREDENTIAL_ACTIVE_KEY_ID: ${LINE_CREDENTIAL_ACTIVE_KEY_ID:-}
      LINE_CREDENTIAL_VERIFICATION_ENABLED: ${LINE_CREDENTIAL_VERIFICATION_ENABLED:-false}
      LINE_REPLY_ENABLED: ${LINE_REPLY_ENABLED:-false}
      SCAFFOLD_501_APPROVED_ROUTES: ${SCAFFOLD_501_APPROVED_ROUTES:-}
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  web:
    image: chatto-web:local
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000}
        API_INTERNAL_BASE_URL: http://api:4000
    container_name: chatto-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_INTERNAL_BASE_URL: http://api:4000
      LINE_PUBLIC_WEBHOOK_URL: ${LINE_PUBLIC_WEBHOOK_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  prisma-studio:
    profiles: ["admin"]
    image: chatto-api:local
    container_name: chatto-prisma-studio
    restart: unless-stopped
    environment:
      DATABASE_URL: ${ADMIN_DATABASE_URL:?Admin database URL required}
      CHECKPOINT_DISABLE: "1"
    command:
      - pnpm
      - --filter
      - "@chatto/api"
      - exec
      - prisma
      - studio
      - --schema
      - prisma/schema.prisma
      - --hostname
      - 0.0.0.0
      - --port
      - "5555"
      - --browser
      - none
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
