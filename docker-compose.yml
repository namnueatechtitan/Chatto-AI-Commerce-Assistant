services:
  postgres:
    image: postgres:16-alpine
    container_name: chatto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatto_phase2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    image: node:20-alpine
    container_name: chatto-api
    working_dir: /workspace
    command: >
      sh -c "corepack enable &&
      pnpm install &&
      pnpm --filter @chatto/api dev"
    environment:
      NODE_ENV: development
      API_PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/chatto_phase2?schema=public
      JWT_SECRET: change-me-for-local-development
      LINE_CHANNEL_SECRET: phase-2-placeholder-secret
      LINE_CHANNEL_ACCESS_TOKEN: phase-2-placeholder-token
      OPENAI_API_KEY: phase-2-placeholder-key
    ports:
      - "4000:4000"
    depends_on:
      - postgres
    volumes:
      - ./:/workspace

  web:
    image: node:20-alpine
    container_name: chatto-web
    working_dir: /workspace
    command: >
      sh -c "corepack enable &&
      pnpm install &&
      pnpm --filter @chatto/web dev"
    environment:
      NODE_ENV: development
      WEB_PORT: 3000
      API_PORT: 4000
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./:/workspace

  ai-service:
    image: node:20-alpine
    container_name: chatto-ai-service
    working_dir: /workspace
    command: >
      sh -c "corepack enable &&
      pnpm install &&
      pnpm --filter @chatto/ai-service dev"
    environment:
      NODE_ENV: development
      AI_SERVICE_PORT: 5000
      OPENAI_API_KEY: phase-2-placeholder-key
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    volumes:
      - ./:/workspace

volumes:
  postgres-data:
